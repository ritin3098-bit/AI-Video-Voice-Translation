<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxBridge — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d0d14;
  --paper: #f5f3ee;
  --accent: #e8611a;
  --accent2: #1a3de8;
  --muted: #8a8880;
  --border: rgba(13,13,20,0.12);
  --card: #ffffff;
  --error: #d63031;
  --success: #00b894;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Left panel — visual */
.panel-left {
  width: 52%;
  background: var(--ink);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px;
  overflow: hidden;
}

.panel-left::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(232,97,26,0.35) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 80% 20%, rgba(26,61,232,0.3) 0%, transparent 60%);
}

.logo {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-mark {
  width: 40px; height: 40px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

.logo-text {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
}

.hero-content {
  position: relative;
  z-index: 2;
}

.hero-tag {
  display: inline-block;
  background: rgba(232,97,26,0.2);
  border: 1px solid rgba(232,97,26,0.4);
  color: var(--accent);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 50px;
  margin-bottom: 24px;
}

.hero-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(36px, 4vw, 52px);
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 20px;
  letter-spacing: -1.5px;
}

.hero-title span { color: var(--accent); }

.hero-desc {
  font-size: 15px;
  color: rgba(255,255,255,0.55);
  line-height: 1.7;
  max-width: 360px;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  animation: float 6s ease-in-out infinite;
}
.orb1 { width:300px; height:300px; background:rgba(232,97,26,0.15); top:30%; left:-80px; animation-delay:0s; }
.orb2 { width:250px; height:250px; background:rgba(26,61,232,0.12); bottom:10%; right:-60px; animation-delay:3s; }

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

/* Right panel — form */
.panel-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 60px 48px;
  background: var(--paper);
}

.form-box {
  width: 100%;
  max-width: 420px;
}

.form-header {
  margin-bottom: 32px;
}

.form-header h2 {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 8px;
}

.form-header p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
}

.form-header a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}

.field {
  margin-bottom: 24px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  color: var(--ink);
  background: var(--card);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(232,97,26,0.1);
}

.btn-submit {
  width: 100%;
  padding: 15px;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}

.btn-submit:hover {
  background: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(232,97,26,0.3);
}

.btn-submit.loading { pointer-events: none; opacity: 0.7; }

.alert {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 20px;
  display: none;
  line-height: 1.5;
}

.alert.error { background: rgba(214,48,49,0.08); color: var(--error); border: 1px solid rgba(214,48,49,0.2); }
.alert.success { background: rgba(0,184,148,0.08); color: var(--success); border: 1px solid rgba(0,184,148,0.2); }

.back-link {
  display: block;
  text-align: center;
  margin-top: 24px;
  font-size: 14px;
  color: var(--muted);
  text-decoration: none;
}

.back-link:hover { color: var(--ink); }

@media (max-width: 768px) {
  .panel-left { display: none; }
  .panel-right { padding: 40px 24px; }
}
</style>
</head>
<body>

<div class="panel-left">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="logo">
    <div class="logo-mark">🎙</div>
    <span class="logo-text">VoxBridge</span>
  </div>

  <div class="hero-content">
    <div class="hero-tag">Account Recovery</div>
    <h1 class="hero-title">Let's get you<br>back <span>in</span></h1>
    <p class="hero-desc">Enter the email address on your account and we'll send you a link to set a new password.</p>
  </div>

  <div></div>
</div>

<div class="panel-right">
  <div class="form-box">
    <div class="form-header">
      <h2>Forgot password?</h2>
      <p>No worries, it happens. We'll send a reset link to your email.</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="forgotForm">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Send Reset Link →</button>
    </form>

    <a href="/login" class="back-link">← Back to Sign In</a>
  </div>
</div>

<script>
function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `alert ${type}`;
  el.style.display = 'block';
}

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submitBtn');

  if (!email) {
    showAlert('Please enter your email address.', 'error');
    return;
  }

  btn.textContent = 'Sending...';
  btn.classList.add('loading');

  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Something went wrong. Please try again.', 'error');
    } else {
      showAlert(data.message || "If an account exists for that email, we've sent password reset instructions.", 'success');
      document.getElementById('forgotForm').reset();
    }
  } catch (err) {
    showAlert('Network error. Please try again.', 'error');
  } finally {
    btn.textContent = 'Send Reset Link →';
    btn.classList.remove('loading');
  }
});
</script>
</body>
</html>
