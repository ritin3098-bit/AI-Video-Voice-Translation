<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxBridge — Set New Password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d0d14;
  --paper: #f5f3ee;
  --accent: #e8611a;
  --accent2: #1a3de8;
  --muted: #8a8880;
  --border: rgba(13,13,20,0.12);
  --card: #ffffff;
  --error: #d63031;
  --success: #00b894;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

.panel-left {
  width: 52%;
  background: var(--ink);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px;
  overflow: hidden;
}

.panel-left::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 50% 50% at 70% 80%, rgba(26,61,232,0.35) 0%, transparent 65%),
    radial-gradient(ellipse 40% 40% at 20% 20%, rgba(232,97,26,0.3) 0%, transparent 60%);
}

.logo {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 12px;
}

.logo-mark {
  width: 40px; height: 40px;
  background: var(--accent2);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}

.logo-text {
  font-family: 'Syne', sans-serif;
  font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px;
}

.hero-content { position: relative; z-index: 2; }

.hero-tag {
  display: inline-block;
  background: rgba(26,61,232,0.2);
  border: 1px solid rgba(26,61,232,0.4);
  color: #7b96ff;
  font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
  padding: 5px 12px; border-radius: 50px; margin-bottom: 24px;
}

.hero-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(34px, 4vw, 50px); font-weight: 800; color: #fff;
  line-height: 1.1; margin-bottom: 20px; letter-spacing: -1.5px;
}

.hero-title span { color: #7b96ff; }

.hero-desc {
  font-size: 15px; color: rgba(255,255,255,0.55); line-height: 1.7; max-width: 360px;
}

.orb {
  position: absolute; border-radius: 50%; filter: blur(60px);
  animation: float 6s ease-in-out infinite;
}
.orb1 { width:300px; height:300px; background:rgba(26,61,232,0.15); bottom:15%; right:-80px; animation-delay:0s; }
.orb2 { width:200px; height:200px; background:rgba(232,97,26,0.12); top:15%; left:-40px; animation-delay:3s; }

@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

.panel-right {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 48px;
  background: var(--paper);
  overflow-y: auto;
}

.form-box { width: 100%; max-width: 420px; }

.form-header { margin-bottom: 32px; }

.form-header h2 {
  font-family: 'Syne', sans-serif;
  font-size: 30px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px;
}

.form-header p { font-size: 14px; color: var(--muted); line-height: 1.6; }

.field { margin-bottom: 18px; }

.field label {
  display: block; font-size: 12px; font-weight: 500;
  letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
}

.field input {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink);
  background: var(--card); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 4px rgba(26,61,232,0.08);
}

.strength-bar {
  height: 3px; background: var(--border); border-radius: 10px;
  margin-top: 8px; overflow: hidden;
}

.strength-fill {
  height: 100%; width: 0; border-radius: 10px;
  transition: width 0.3s, background 0.3s;
}

.strength-text { font-size: 11px; color: var(--muted); margin-top: 4px; }

.btn-submit {
  width: 100%; padding: 15px;
  background: var(--ink); color: #fff;
  border: none; border-radius: 10px;
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
  margin-top: 6px;
}

.btn-submit:hover {
  background: var(--accent2);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(26,61,232,0.3);
}

.btn-submit.loading { pointer-events: none; opacity: 0.7; }

.alert {
  padding: 12px 16px; border-radius: 8px; font-size: 13px;
  margin-bottom: 18px; display: none; line-height: 1.5;
}

.alert.error { background: rgba(214,48,49,0.08); color: var(--error); border: 1px solid rgba(214,48,49,0.2); }
.alert.success { background: rgba(0,184,148,0.08); color: var(--success); border: 1px solid rgba(0,184,148,0.2); }

.back-link {
  display: block;
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
}

.back-link:hover { color: var(--ink); }

@media (max-width: 768px) {
  .panel-left { display: none; }
  .panel-right { padding: 40px 24px; }
}
</style>
</head>
<body>

<div class="panel-left">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="logo">
    <div class="logo-mark">🎙</div>
    <span class="logo-text">VoxBridge</span>
  </div>

  <div class="hero-content">
    <div class="hero-tag">Almost there</div>
    <h1 class="hero-title">Set a new<br><span>password</span></h1>
    <p class="hero-desc">Choose a strong password you haven't used before. This link can only be used once.</p>
  </div>

  <div></div>
</div>

<div class="panel-right">
  <div class="form-box">
    <div class="form-header">
      <h2>Reset your password</h2>
      <p>Enter a new password for your account below.</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="resetForm">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" oninput="checkStrength(this.value)" required>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-text" id="strengthText"></div>
      </div>

      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" id="confirm" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Reset Password →</button>
    </form>

    <a href="/login" class="back-link">← Back to Sign In</a>
  </div>
</div>

<script>
const RESET_TOKEN = {{ token | tojson }};

function checkStrength(pwd) {
  const fill = document.getElementById('strengthFill');
  const text = document.getElementById('strengthText');
  if (!pwd) { fill.style.width = '0'; text.textContent = ''; return; }

  let score = 0;
  if (pwd.length >= 6) score++;
  if (pwd.length >= 10) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^a-zA-Z0-9]/.test(pwd)) score++;

  const levels = [
    { pct: '20%', color: '#d63031', label: 'Very weak' },
    { pct: '40%', color: '#e17055', label: 'Weak' },
    { pct: '60%', color: '#fdcb6e', label: 'Fair' },
    { pct: '80%', color: '#00b894', label: 'Strong' },
    { pct: '100%', color: '#00cec9', label: 'Very strong' },
  ];

  const lvl = levels[Math.min(score - 1, 4)] || levels[0];
  fill.style.width = lvl.pct;
  fill.style.background = lvl.color;
  text.textContent = lvl.label;
  text.style.color = lvl.color;
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `alert ${type}`;
  el.style.display = 'block';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const btn = document.getElementById('submitBtn');

  if (!password || !confirm) {
    showAlert('Please fill in both fields.', 'error');
    return;
  }
  if (password.length < 6) {
    showAlert('Password must be at least 6 characters.', 'error');
    return;
  }
  if (password !== confirm) {
    showAlert('Passwords do not match.', 'error');
    return;
  }

  btn.textContent = 'Resetting...';
  btn.classList.add('loading');

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: RESET_TOKEN, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Could not reset password. Please try again.', 'error');
      btn.textContent = 'Reset Password →';
      btn.classList.remove('loading');
    } else {
      showAlert('Password reset! Redirecting you to sign in...', 'success');
      setTimeout(() => window.location.href = '/login', 1200);
    }
  } catch (err) {
    showAlert('Network error. Please try again.', 'error');
    btn.textContent = 'Reset Password →';
    btn.classList.remove('loading');
  }
});
</script>
</body>
</html>
